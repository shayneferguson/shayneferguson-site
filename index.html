<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shayne Ferguson</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f5f5f1;
      --text: #0e0e0e;
      --muted: #6c6c68;
      --muted-dark: #575753;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 760px;
      width: 100%;
      opacity: 0;
      animation: pageFade 1s ease forwards;
    }

    @keyframes pageFade {
      to {
        opacity: 1;
      }
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
      font-weight: 600;
    }

    .animation-block {
      margin-top: 24px;
      min-height: 3.2em;
    }

    .line-one,
    .line-two {
      opacity: 0;
    }

    .line-one {
      color: var(--muted-dark);
      font-size: clamp(1rem, 2vw, 1.15rem);
      letter-spacing: -0.01em;
      display: flex;
      gap: 0.42em;
      flex-wrap: wrap;
      animation: lineFade 12s infinite;
    }

    .line-two {
      margin-top: 0.2em;
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.15rem);
      letter-spacing: -0.01em;
      animation: lineFade 12s infinite;
      animation-delay: 0s;
    }

    .line-one span {
      opacity: 0;
      animation: wordAppear 12s infinite;
    }

    .line-one span:nth-child(1) {
      animation-delay: 0s;
    }

    .line-one span:nth-child(2) {
      animation-delay: 0.8s;
    }

    .line-one span:nth-child(3) {
      animation-delay: 1.6s;
    }

    .line-two span {
      opacity: 0;
      animation: launchAppear 12s infinite;
    }

    @keyframes wordAppear {
      0%   { opacity: 0; }
      6%   { opacity: 0; }
      10%  { opacity: 1; }
      58%  { opacity: 1; }
      66%  { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes launchAppear {
      0%   { opacity: 0; }
      26%  { opacity: 0; }
      32%  { opacity: 1; }
      58%  { opacity: 1; }
      66%  { opacity: 0; }
      100% { opacity: 0; }
    }

    @keyframes lineFade {
      0%   { opacity: 1; }
      58%  { opacity: 1; }
      66%  { opacity: 0; }
      100% { opacity: 0; }
    }

    .meta {
      margin-top: 36px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .meta a {
      display: inline-block;
      margin-top: 10px;
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--text);
      padding-bottom: 2px;
    }

    .meta a:hover {
      opacity: 0.6;
    }

    .footer {
      position: fixed;
      bottom: 20px;
      left: 32px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .animation-block {
        min-height: 3.8em;
      }
    }
  </style>
</head>
<body>

  <main class="wrap">
    <h1>Shayne Ferguson</h1>

    <div class="animation-block">
      <div class="line-one">
        <span>Identity</span>
        <span>Digital</span>
        <span>Motion</span>
      </div>

      <div class="line-two">
        <span>Launching soon</span>
      </div>
    </div>

    <div class="meta">
      <a href="mailto:shaynepaulferguson@gmail.com?subject=Project%20Inquiry">
        shaynepaulferguson@gmail.com
      </a>
    </div>
  </main>

  <div class="footer">© 2026</div>

</body>
</html>
