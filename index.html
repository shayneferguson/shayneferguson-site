<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shayne Ferguson</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f5f5f1;
      --text: #0e0e0e;
      --muted: #6c6c68;
      --line: rgba(0, 0, 0, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 760px;
      width: 100%;
      opacity: 0;
      transform: translateY(8px);
      animation: pageFade 1s ease forwards;
    }

    @keyframes pageFade {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 8vw, 6rem);
      line-height: 0.95;
      letter-spacing: -0.05em;
      font-weight: 600;
    }

    .rule {
      width: 100%;
      max-width: 520px;
      height: 1px;
      background: var(--line);
      margin: 28px 0 18px;
    }

    .animated-line {
      position: relative;
      height: 1.4em;
      font-size: clamp(1rem, 2vw, 1.15rem);
      color: var(--muted);
      letter-spacing: -0.01em;
      overflow: hidden;
    }

    .word {
      position: absolute;
      inset: 0 auto auto 0;
      opacity: 0;
      transform: translateY(8px);
      animation: wordFade 16s infinite;
      white-space: nowrap;
    }

    .word:nth-child(1) { animation-delay: 0s; }
    .word:nth-child(2) { animation-delay: 4s; }
    .word:nth-child(3) { animation-delay: 8s; }
    .word:nth-child(4) { animation-delay: 12s; }

    @keyframes wordFade {
      0% {
        opacity: 0;
        transform: translateY(8px);
      }
      8% {
        opacity: 1;
        transform: translateY(0);
      }
      17% {
        opacity: 1;
        transform: translateY(0);
      }
      23% {
        opacity: 0;
        transform: translateY(-8px);
      }
      100% {
        opacity: 0;
        transform: translateY(-8px);
      }
    }

    .meta {
      margin-top: 32px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .meta a {
      display: inline-block;
      margin-top: 10px;
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid var(--text);
      padding-bottom: 2px;
    }

    .meta a:hover {
      opacity: 0.6;
    }

    .footer {
      position: fixed;
      bottom: 20px;
      left: 32px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .animated-line {
        height: 1.6em;
      }

      .word {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Shayne Ferguson</h1>

    <div class="rule"></div>

    <div class="animated-line" aria-label="Animated text">
      <span class="word">Identity</span>
      <span class="word">Digital</span>
      <span class="word">Motion</span>
      <span class="word">Launching soon</span>
    </div>

    <div class="meta">
      <a href="mailto:shaynepaulferguson@gmail.com?subject=Project%20Inquiry">
        shaynepaulferguson@gmail.com
      </a>
    </div>
  </main>

  <div class="footer">© 2026</div>
</body>
</html>
