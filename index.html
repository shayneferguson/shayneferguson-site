<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shayne Ferguson</title>

  <!-- Google Font (clean + modern) -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f5f5f3;
      --text: #0f0f0f;
      --muted: #6a6a6a;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .container {
      max-width: 720px;
      width: 100%;
    }

    .name {
      font-size: clamp(2.8rem, 6vw, 5.5rem);
      font-weight: 600;
      letter-spacing: -0.045em;
      margin: 0 0 28px 0;
      line-height: 0.95;
    }

    .line {
      font-size: 1.1rem;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .spacer {
      height: 24px;
    }

    .email {
      display: inline-block;
      margin-top: 20px;
      font-size: 1rem;
      text-decoration: none;
      color: var(--text);
      border-bottom: 1px solid var(--text);
      padding-bottom: 2px;
      transition: opacity 0.25s ease;
    }

    .email:hover {
      opacity: 0.6;
    }

    /* subtle fade-in */
    .container {
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 1.2s ease forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* tiny bottom signature */
    .footer {
      position: fixed;
      bottom: 20px;
      left: 40px;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <main class="container">
    <h1 class="name">Shayne Ferguson</h1>

    <div class="line">Creative direction, design, and digital work.</div>

    <div class="spacer"></div>

    <div class="line">A new site is in progress.</div>
    <div class="line">Launching soon.</div>

    <a class="email" href="mailto:your@email.com">your@email.com</a>
  </main>

  <div class="footer">© 2026</div>

</body>
</html>
